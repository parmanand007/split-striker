    <!-- Anti-FOUC: apply saved theme before React renders -->
    <script>
      (function() {
        var valid = ['maroon','forest','amber','olive','teal','rust'];
        var saved = localStorage.getItem('split_striker_theme');
        var theme = valid.indexOf(saved) !== -1 ? saved : 'maroon';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.classList.remove('dark');
      })();
    </script>

    <!-- FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Is Split Striker free to use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, Split Striker is completely free. No credit card required, no ads, no hidden fees."
          }
        },
        {
          "@type": "Question",
          "name": "How do I split expenses with friends?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sign up for free, create a group, invite your friends using a shareable link, and start adding expenses. Split Striker automatically calculates who owes what and suggests the simplest settlement."
          }
        },
        {
          "@type": "Question",
          "name": "Can I use Split Striker for group trips?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Absolutely! Split Striker is perfect for group travel, shared apartments, and any situation where multiple people share costs. It supports multiple currencies and exchange rates too."
          }
        },
        {
          "@type": "Question",
          "name": "Is Split Striker a Splitwise alternative?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes! Split Striker offers all the core features of Splitwise — group expenses, bill splitting, debt tracking, and settlement suggestions — with a modern interface and no ads."
          }
        },
        {
          "@type": "Question",
          "name": "How do I invite friends to my expense group?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "In your group settings, click 'Generate invite link'. Share the link with friends — anyone who clicks it can join your group instantly."
          }
        },
        {
          "@type": "Question",
          "name": "Does Split Striker work on mobile?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, Split Striker is fully responsive and works great on phones, tablets, and desktops. You can also add it to your home screen as a PWA."
          }
        },
        {
          "@type": "Question",
          "name": "What currencies does Split Striker support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Split Striker supports any currency. You can set a default currency per group and add expenses in different currencies with custom exchange rates."
          }
        }
      ]
    }
