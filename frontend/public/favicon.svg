      <stop offset="0%" stop-color="#7f0e26"/>
      <stop offset="55%" stop-color="#be1240"/>
      <stop offset="100%" stop-color="#e63358"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0%" y1="0%" x2="30%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
