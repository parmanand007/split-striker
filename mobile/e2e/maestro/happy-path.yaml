# UI E2E (iOS Simulator + Maestro).
# Prerequisites:
#   Metro running; backend on :8000
#   Seed: node scripts/e2e-seed-user.mjs  → paste email below
#   maestro --device <UDID> test e2e/maestro/happy-path.yaml
appId: com.splitstriker.app
---
- launchApp:
    clearState: true
- openLink: exp+split-striker://expo-development-client/?url=http://127.0.0.1:8081
- extendedWaitUntil:
    visible: "Continue"
    timeout: 90000
- tapOn: "Continue"
- runFlow:
    when:
      visible: "Reload"
    commands:
      - tapOn: "Go home"
- runFlow:
    when:
      visible: "Enter URL manually"
    commands:
      - openLink: exp+split-striker://expo-development-client/?url=http://127.0.0.1:8081
- extendedWaitUntil:
    visible: ".*friendships.*"
    timeout: 90000
- scrollUntilVisible:
    element:
      id: "welcome-login"
    direction: DOWN
    timeout: 25000
    visibilityPercentage: 30
    centerElement: true
- tapOn:
    id: "welcome-login"
- tapOn:
    id: "login-email"
- inputText: "SEED_EMAIL"
- tapOn:
    id: "login-password"
- inputText: "testpass123"
- tapOn:
    id: "login-submit"
- runFlow:
    when:
      visible: "Save Password?"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible:
      id: "home-user-name"
    timeout: 45000
- assertVisible:
    id: "home-user-name"
- assertVisible: "You are owed"
- assertVisible: "E2E iOS User"
- tapOn:
    id: "home-create-group"
- extendedWaitUntil:
    visible:
      id: "group-name"
    timeout: 15000
- tapOn:
    id: "group-name"
- inputText: "Goa Trip E2E"
- scrollUntilVisible:
    element:
      id: "group-create-submit"
    direction: DOWN
    visibilityPercentage: 40
- tapOn:
    id: "group-create-submit"
- extendedWaitUntil:
    visible: "Goa Trip E2E"
    timeout: 20000
- assertVisible: "Goa Trip E2E"
- assertVisible: "Trip budget"
