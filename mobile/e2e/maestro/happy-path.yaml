# UI E2E (iOS Simulator + Maestro).
# 1) Keep Metro on LAN: REACT_NATIVE_PACKAGER_HOSTNAME=192.168.1.14 npx expo start --lan
# 2) Seed user: node scripts/e2e-seed-user.mjs
# 3) Replace SEED_EMAIL below, then:
#    maestro --device <UDID> test e2e/maestro/happy-path.yaml
appId: com.splitstriker.app
---
- launchApp:
    clearState: true
- openLink: exp+split-striker://expo-development-client/?url=http://192.168.1.14:8081
- extendedWaitUntil:
    visible: "Continue"
    timeout: 90000
- tapOn: "Continue"
- runFlow:
    when:
      visible: "Reload"
    commands:
      - tapOn: "Go home"
- runFlow:
    when:
      visible: "Enter URL manually"
    commands:
      - openLink: exp+split-striker://expo-development-client/?url=http://192.168.1.14:8081
- extendedWaitUntil:
    visible: ".*friendships.*"
    timeout: 90000
- scrollUntilVisible:
    element:
      id: "welcome-login"
    direction: DOWN
    timeout: 25000
    visibilityPercentage: 30
    centerElement: true
- tapOn:
    id: "welcome-login"
- tapOn:
    id: "login-email"
- inputText: "SEED_EMAIL"
- tapOn:
    id: "login-password"
- inputText: "testpass123"
- tapOn: "Sign in to your account."
- tapOn:
    id: "login-submit"
- runFlow:
    when:
      visible: "Save Password?"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible: "YOU ARE OWED"
    timeout: 45000
- assertVisible: "YOU ARE OWED"
- assertVisible: "E2E iOS User"
- tapOn:
    id: "home-create-group"
- tapOn:
    id: "group-name"
- inputText: "Goa Trip E2E"
- tapOn: "Currency"
- scrollUntilVisible:
    element:
      id: "group-create-submit"
    direction: DOWN
    visibilityPercentage: 40
- tapOn:
    id: "group-create-submit"
- extendedWaitUntil:
    visible: "Goa Trip E2E"
    timeout: 20000
- assertVisible: "Goa Trip E2E"
